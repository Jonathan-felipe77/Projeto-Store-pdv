<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ status_code }} — M&J STORE</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --preto: #050505;
            --preto-card: #0d0d0d;
            --branco: #ffffff;
            --cinza: #a1a1aa;
            --cinza-escuro: #222222;
            --verde: #c8ff1a;
            --verde-hover: #d9ff4d;
        }

        body {
            min-height: 100vh;

            font-family: 'Montserrat', sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(200, 255, 26, 0.08),
                    transparent 30%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(200, 255, 26, 0.04),
                    transparent 25%
                ),
                var(--preto);

            color: var(--branco);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .error-container {
            width: min(560px, 100%);
            text-align: center;
        }

        /* =====================================================
           LOGO
        ===================================================== */

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;

            margin-bottom: 32px;
        }

        .logo .store {
            color: var(--verde);
        }

        /* =====================================================
           CARD
        ===================================================== */

        .error-card {
            position: relative;

            background:
                linear-gradient(
                    145deg,
                    #101010,
                    #090909
                );

            border: 1px solid #222;

            border-radius: 18px;

            padding: 55px 40px;

            overflow: hidden;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35);
        }

        /* Linha verde no topo */

        .error-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 3px;

            background: var(--verde);
        }

        /* =====================================================
           CÓDIGO DO ERRO
        ===================================================== */

        .error-code {
            color: var(--verde);

            font-size: 82px;
            font-weight: 800;

            line-height: 1;

            letter-spacing: -5px;

            margin-bottom: 22px;
        }

        /* =====================================================
           TÍTULO
        ===================================================== */

        .error-title {
            font-size: 26px;

            font-weight: 800;

            margin-bottom: 15px;
        }

        /* =====================================================
           MENSAGEM
        ===================================================== */

        .error-message {
            color: var(--cinza);

            font-size: 14px;

            line-height: 1.7;

            max-width: 430px;

            margin: 0 auto 14px;
        }

        /* =====================================================
           DETALHE
        ===================================================== */

        .error-detail {
            color: #626262;

            font-size: 11px;

            line-height: 1.6;

            max-width: 420px;

            margin: 0 auto 30px;
        }

        /* =====================================================
           BOTÃO
        ===================================================== */

        .btn-home {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 215px;

            padding: 14px 24px;

            background: var(--verde);

            color: #050505;

            border-radius: 10px;

            text-decoration: none;

            font-size: 12px;

            font-weight: 800;

            transition: 0.2s;
        }

        .btn-home:hover {
            background: var(--verde-hover);

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(200, 255, 26, 0.15);
        }

        /* =====================================================
           RODAPÉ
        ===================================================== */

        .footer {
            margin-top: 24px;

            color: #4f4f4f;

            font-size: 10px;

            letter-spacing: 1px;
        }

        /* =====================================================
           RESPONSIVO
        ===================================================== */

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .error-card {
                padding: 45px 25px;
            }

            .error-code {
                font-size: 68px;
            }

            .error-title {
                font-size: 21px;
            }

            .error-message {
                font-size: 13px;
            }
        }
    </style>

</head>

<body>

    <main class="error-container">

        <!-- LOGO -->

        <div class="logo">
            M&J <span class="store">STORE</span>
        </div>


        <!-- CARD DE ERRO -->

        <section class="error-card">

            <!-- CÓDIGO -->

            <div class="error-code">
                {{ status_code }}
            </div>


            <!-- TÍTULO -->

            <h1 class="error-title">
                {{ titulo }}
            </h1>


            <!-- MENSAGEM -->

            <p class="error-message">
                {{ mensagem }}
            </p>


            <!-- DETALHE -->

            {% if detalhe %}

                <div class="error-detail">
                    {{ detalhe }}
                </div>

            {% endif %}


            <!-- BOTÃO -->

            <a
                href="/"
                class="btn-home"
            >
                ← VOLTAR PARA O INÍCIO
            </a>

        </section>


        <!-- RODAPÉ -->

        <div class="footer">
            © 2026 M&J STORE — SISTEMA INTERNO
        </div>

    </main>

</body>

</html>
