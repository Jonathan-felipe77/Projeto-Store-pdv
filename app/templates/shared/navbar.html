<!-- Navegação global do sistema -->
<nav class="app-navbar" aria-label="Navegação principal">
    <div class="app-navbar-inner">
        <a href="/" class="app-navbar-brand" aria-label="M&J Store - Dashboard">
            <span class="app-navbar-brand-main">M&J</span>
            <span class="app-navbar-brand-sub">STORE</span>
        </a>

        <button class="app-navbar-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="app-navbar-menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="app-navbar-menu" id="app-navbar-menu">
            <div class="app-navbar-links">
                <a href="/" class="app-navbar-link {% if request.url.path == '/' %}active{% endif %}">
                    <span class="app-navbar-icon">⌂</span>
                    Dashboard
                </a>
                <a href="/pdv" class="app-navbar-link {% if request.url.path.startswith('/pdv') %}active{% endif %}">
                    <span class="app-navbar-icon">▣</span>
                    PDV
                </a>
                <a href="/produtos" class="app-navbar-link {% if request.url.path.startswith('/produtos') %}active{% endif %}">
                    <span class="app-navbar-icon">□</span>
                    Produtos
                </a>
                <a href="/categorias" class="app-navbar-link {% if request.url.path.startswith('/categorias') %}active{% endif %}">
                    <span class="app-navbar-icon">◫</span>
                    Categorias
                </a>
                <a href="/clientes" class="app-navbar-link {% if request.url.path.startswith('/clientes') %}active{% endif %}">
                    <span class="app-navbar-icon">♙</span>
                    Clientes
                </a>
                <a href="/movimentacoes" class="app-navbar-link {% if request.url.path.startswith('/movimentacoes') %}active{% endif %}">
                    <span class="app-navbar-icon">↕</span>
                    Estoque
                </a>
                {% if usuario and usuario.get('role') == 'admin' %}
                <a href="/usuarios" class="app-navbar-link {% if request.url.path.startswith('/usuarios') %}active{% endif %}">
                    <span class="app-navbar-icon">♚</span>
                    Usuários
                </a>
                {% endif %}
            </div>

            <div class="app-navbar-actions">
                <span class="app-navbar-user">
                    {% if usuario %}
                        {{ usuario.nome or usuario.get('nome') or usuario.email or usuario.get('email') or 'Usuário' }}
                    {% else %}
                        Sistema
                    {% endif %}
                </span>
                <a href="/auth/logout" class="app-navbar-logout">Sair</a>
            </div>
        </div>
    </div>
</nav>

<script>
(function () {
    const toggle = document.querySelector('.app-navbar-toggle');
    const menu = document.getElementById('app-navbar-menu');

    if (!toggle || !menu) return;

    toggle.addEventListener('click', function () {
        const aberto = menu.classList.toggle('is-open');
        toggle.setAttribute('aria-expanded', String(aberto));
    });

    menu.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', function () {
            menu.classList.remove('is-open');
            toggle.setAttribute('aria-expanded', 'false');
        });
    });
})();
</script>
