<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro — M&J Store</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0b; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
        .card { width: 100%; max-width: 420px; background: #151515; border: 1px solid #292929; border-radius: 16px; padding: 30px; }
        h1 { margin: 0 0 8px; color: #00ff88; font-size: 25px; }
        p { color: #aaa; margin: 0 0 22px; }
        label { display: block; margin: 13px 0 6px; color: #ccc; font-size: 13px; }
        input { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 8px; background: #101010; color: #fff; }
        button, .link { width: 100%; display: block; margin-top: 18px; padding: 12px; text-align: center; border: 0; border-radius: 8px; text-decoration: none; font-weight: 700; cursor: pointer; }
        button { background: #00ff88; color: #000; }
        .link { color: #00ff88; border: 1px solid #333; }
        .erro { padding: 10px; border: 1px solid #682525; border-radius: 8px; background: #351313; color: #ff8888; margin-bottom: 12px; }
    </style>
</head>
<body>
    <main class="card">
        <h1>M&J Store</h1>
        <p>Crie seu cadastro para acessar o sistema.</p>
        {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
        <form action="/auth/cadastro" method="post">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" required maxlength="100">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" required maxlength="150">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" required minlength="6">
            <button type="submit">Cadastrar</button>
        </form>
        <a class="link" href="/auth/login">Voltar para login</a>
    </main>
</body>
</html>
