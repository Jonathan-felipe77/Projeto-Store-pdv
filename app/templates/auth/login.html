<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | M&J Store</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --verde: #c8ff1a;
            --verde-hover: #b7ec0e;
            --preto: #050505;
            --cinza: #777;
            --borda: rgba(255,255,255,0.09);
        }

        body {
            min-height: 100vh;

            font-family: 'Montserrat', sans-serif;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    rgba(0,0,0,.90),
                    rgba(5,5,5,.96)
                ),
                url('/static/img/fundo.png');

            background-size: cover;
            background-position: center;
        }


        /* =========================
           EFEITOS DE FUNDO
        ========================= */

        body::before {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            background: var(--verde);

            border-radius: 50%;

            filter: blur(180px);

            opacity: .08;

            top: -200px;
            left: -150px;

            pointer-events: none;
        }

        body::after {
            content: "";

            position: fixed;

            width: 450px;
            height: 450px;

            background: var(--verde);

            border-radius: 50%;

            filter: blur(180px);

            opacity: .06;

            bottom: -200px;
            right: -150px;

            pointer-events: none;
        }


        /* =========================
           CONTAINER
        ========================= */

        .login-wrapper {

            width: 100%;
            max-width: 440px;

            padding: 25px;

            position: relative;
            z-index: 2;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            text-align: center;

            margin-bottom: 32px;
        }

        .logo-name {

            font-size: 38px;

            font-weight: 900;

            letter-spacing: -2px;

            line-height: 1;
        }

        .logo-name span {

            color: var(--verde);
        }

        .logo-line {

            width: 45px;
            height: 3px;

            background: var(--verde);

            margin: 13px auto 10px;

            border-radius: 10px;
        }

        .logo-subtitle {

            color: #666;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 4px;
        }


        /* =========================
           CARD
        ========================= */

        .login-card {

            position: relative;

            background: rgba(10,10,10,.90);

            border: 1px solid var(--borda);

            border-radius: 18px;

            padding: 42px;

            box-shadow:
                0 30px 80px rgba(0,0,0,.65),
                inset 0 1px 0 rgba(255,255,255,.03);

            backdrop-filter: blur(15px);

            -webkit-backdrop-filter: blur(15px);
        }


        /* LINHA VERDE NO TOPO */

        .login-card::before {

            content: "";

            position: absolute;

            top: 0;
            left: 40px;
            right: 40px;

            height: 2px;

            background: linear-gradient(
                90deg,
                transparent,
                var(--verde),
                transparent
            );

            border-radius: 10px;
        }


        /* =========================
           CABEÇALHO
        ========================= */

        .login-header {

            margin-bottom: 30px;
        }

        .access {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            color: var(--verde);

            font-size: 9px;

            font-weight: 800;

            letter-spacing: 2px;

            margin-bottom: 12px;
        }

        .access-dot {

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--verde);

            box-shadow: 0 0 10px var(--verde);
        }

        .login-header h1 {

            font-size: 32px;

            font-weight: 900;

            letter-spacing: -1px;

            margin-bottom: 9px;
        }

        .login-header p {

            color: #666;

            font-size: 12px;

            line-height: 1.7;
        }


        /* =========================
           CAMPOS
        ========================= */

        .field {

            margin-bottom: 20px;
        }

        .field label {

            display: block;

            color: #aaa;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 1.5px;

            margin-bottom: 8px;
        }

        .input-box {

            position: relative;
        }

        .input-icon {

            position: absolute;

            left: 16px;

            top: 50%;

            transform: translateY(-50%);

            color: #555;

            font-size: 15px;

            pointer-events: none;
        }

        input {

            width: 100%;

            height: 54px;

            padding: 0 16px 0 45px;

            border-radius: 9px;

            border: 1px solid #242424;

            outline: none;

            background: #111;

            color: white;

            font-family: 'Montserrat', sans-serif;

            font-size: 12px;

            transition: .25s;
        }

        input::placeholder {

            color: #505050;
        }

        input:hover {

            border-color: #333;
        }

        input:focus {

            border-color: var(--verde);

            background: #141414;

            box-shadow:
                0 0 0 3px rgba(200,255,26,.07),
                0 0 20px rgba(200,255,26,.04);
        }

        input:focus + .input-icon {

            color: var(--verde);
        }


        /* =========================
           BOTÃO
        ========================= */

        .login-button {

            width: 100%;

            height: 55px;

            margin-top: 5px;

            border: none;

            border-radius: 9px;

            background: var(--verde);

            color: #050505;

            font-family: 'Montserrat', sans-serif;

            font-size: 11px;

            font-weight: 900;

            letter-spacing: 2px;

            cursor: pointer;

            position: relative;

            overflow: hidden;

            transition: .25s;
        }

        .login-button::before {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 100%;
            height: 100%;

            background: rgba(255,255,255,.25);

            transform: skewX(-20deg);

            transition: .5s;
        }

        .login-button:hover {

            background: var(--verde-hover);

            transform: translateY(-2px);

            box-shadow:
                0 10px 30px rgba(200,255,26,.16);
        }

        .login-button:hover::before {

            left: 120%;
        }

        .login-button:active {

            transform: translateY(0);
        }


        /* =========================
           RODAPÉ
        ========================= */

        .security {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            margin-top: 25px;

            color: #444;

            font-size: 9px;

            font-weight: 600;
        }

        .security-icon {

            color: #555;
        }

        .footer {

            text-align: center;

            margin-top: 22px;

            color: #3d3d3d;

            font-size: 9px;

            font-weight: 500;
        }

        .footer span {

            color: #666;
        }


        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 500px) {

            .login-wrapper {

                padding: 18px;
            }

            .login-card {

                padding: 32px 24px;

                border-radius: 15px;
            }

            .login-card::before {

                left: 25px;
                right: 25px;
            }

            .logo-name {

                font-size: 32px;
            }

            .login-header h1 {

                font-size: 28px;
            }
        }

    </style>
</head>

<body>

    <main class="login-wrapper">

        <!-- LOGO -->
        <div class="logo">

            <div class="logo-name">
                M&J <span>STORE</span>
            </div>

            <div class="logo-line"></div>

            <div class="logo-subtitle">
                MODA • ESTILO • QUALIDADE
            </div>

        </div>


        <!-- CARD DE LOGIN -->
        <section class="login-card">

            <div class="login-header">

                <div class="access">
                    <span class="access-dot"></span>
                    ACESSO AO SISTEMA
                </div>

                <h1>Bem-vindo.</h1>

                <p>
                    Entre com suas credenciais para continuar.
                </p>

            </div>


            <!-- FORMULÁRIO -->
            <form action="/auth/login" method="post">

                <!-- EMAIL -->
                <div class="field">

                    <label for="email">
                        E-MAIL
                    </label>

                    <div class="input-box">

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seuemail@exemplo.com"
                            autocomplete="email"
                            required
                        >

                        <span class="input-icon">
                            @
                        </span>

                    </div>

                </div>


                <!-- SENHA -->
                <div class="field">

                    <label for="senha">
                        SENHA
                    </label>

                    <div class="input-box">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                        <span class="input-icon">
                            ●
                        </span>

                    </div>

                </div>


                <!-- BOTÃO -->
                <button
                    type="submit"
                    class="login-button"
                >
                    ENTRAR NO SISTEMA
                </button>

            </form>


            <!-- SEGURANÇA -->
            <div class="security">

                <span class="security-icon"></span>

                Acesso seguro e protegido

            </div>

        </section>


        <!-- FOOTER -->
        <div class="footer">

            M&J Store © 2026
            <span>• Todos os direitos reservados</span>

        </div>

    </main>

</body>

</html>
